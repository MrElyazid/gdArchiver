[project]
name = "gdarchiver"
version = "0.1.0"
description = "A script to archive google drive/docs/sheets content from a website"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bs4>=0.0.2",
    "gdown>=5.2.0",
    "img2pdf>=0.6.3",
    "lxml>=6.0.2",
    "ocrmypdf>=17.13.0",
    "pillow>=12.3.0",
    "playwright>=1.63.0",
    "requests>=2.32.5",
]

[project.optional-dependencies]
archive-tools = [
    "ftfy>=6.3.1",
    "internetarchive>=5.12.0",
    "pikepdf>=10.17.0",
]
